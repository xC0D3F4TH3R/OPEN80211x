[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open80211"
version = "1.0.0"
description = "Advanced wireless & network penetration testing suite (authorized use only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "open80211 contributors" }]
keywords = ["wireless", "wifi", "pentest", "security", "wpa", "mitm", "802.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pycryptodome>=3.19.0",
    "cryptography>=41.0.0",
]

[project.scripts]
open80211 = "open80211.__main__:main"

[tool.setuptools]
packages = ["open80211", "open80211.core", "open80211.modules"]